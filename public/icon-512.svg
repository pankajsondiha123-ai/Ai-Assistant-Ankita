<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#002b4d" />
      <stop offset="70%" stop-color="#020d1a" />
      <stop offset="100%" stop-color="#01060e" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.4" stroke-dasharray="16 8" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00b4d8" stroke-width="4" opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00f0ff" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="100" fill="#001424" stroke="#00f0ff" stroke-width="5" />

  <text x="256" y="278" font-family="'Orbitron', sans-serif" font-size="92" font-weight="900" fill="#00f0ff" text-anchor="middle" filter="url(#glow)">A</text>
  <text x="256" y="325" font-family="'Noto Sans Devanagari', sans-serif" font-size="28" font-weight="700" fill="#8ffcff" text-anchor="middle">अंकिता</text>

  <circle cx="256" cy="86" r="10" fill="#00ff88" filter="url(#glow)" />
  <circle cx="256" cy="426" r="10" fill="#00ff88" filter="url(#glow)" />
  <circle cx="86" cy="256" r="10" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="426" cy="256" r="10" fill="#00f0ff" filter="url(#glow)" />
</svg>
